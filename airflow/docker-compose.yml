version: '3.8'

# Gemeinsame Konfiguration für alle Airflow Services
# Der & Anker erlaubt es, diesen Block per *airflow-common wiederzuverwenden
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.1
  env_file:
    - ../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'olist-secret'
    # AWS Credentials kommen via env_file aus ../.env
    # OpenLineage: sendet Lineage-Events an Marquez
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez:5000", "endpoint": "api/v1/lineage"}'
    AIRFLOW__OPENLINEAGE__NAMESPACE: 'olist-pipeline'
    # Installiert den OpenLineage Provider beim Container-Start
    _PIP_ADDITIONAL_REQUIREMENTS: 'apache-airflow-providers-openlineage great_expectations boto3 pandas dbt-core==1.8.1 dbt-redshift==1.8.1 openlineage-dbt'
  volumes:
    # DAG Dateien aus unserem Repo werden in den Container gemountet
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # Rohdaten damit der DAG die CSVs lesen kann
    - ../data:/opt/airflow/data
    # Great Expectations Skript muss im Container verfügbar sein
    - ../great_expectations:/opt/airflow/great_expectations
    # dbt Projekt für dbt run/test im Container
    - ../dbt:/opt/airflow/dbt
  depends_on:
    postgres:
      condition: service_healthy

services:

  # --------------------------------------------------
  # PostgreSQL - speichert DAG-Status, Task-History etc.
  # Airflow selbst braucht eine Datenbank im Hintergrund
  # --------------------------------------------------
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init-Skript erstellt die Marquez-DB beim ersten Start automatisch
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  # --------------------------------------------------
  # Airflow Init - läuft einmalig beim ersten Start
  # Erstellt die DB Tabellen und den Admin User
  # --------------------------------------------------
  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@olist.local"
    restart: on-failure

  # --------------------------------------------------
  # Webserver - die UI, erreichbar auf localhost:8080
  # --------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --------------------------------------------------
  # Scheduler - überwacht DAGs und startet Tasks
  # Ohne Scheduler passiert nichts
  # --------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  # --------------------------------------------------
  # Marquez API - empfängt OpenLineage Events
  # Airflow und dbt senden Lineage-Daten hierher (Port 5000)
  # --------------------------------------------------
  marquez:
    image: marquezproject/marquez:latest
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      MARQUEZ_CONFIG: /opt/marquez/marquez.yml
    volumes:
      - ./marquez.yml:/opt/marquez/marquez.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # --------------------------------------------------
  # Marquez Web UI - visualisiert den Lineage-Graphen
  # Erreichbar auf localhost:3000
  # --------------------------------------------------
  marquez-web:
    image: marquezproject/marquez-web:latest
    ports:
      - "3000:3000"
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    depends_on:
      - marquez
    restart: always

volumes:
  postgres_data:
