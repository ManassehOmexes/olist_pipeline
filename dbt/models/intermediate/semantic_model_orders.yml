version: 2

# Semantic Layer — alle 6 KPIs auf Basis von int_orders_complete.
# Grain: eine Zeile pro Order-Item (nur delivered orders).
# Zeit-Dimension: order_purchase_timestamp (DAY) — Pflichtanforderung MetricFlow.

semantic_models:
  - name: orders_grain
    description: >
      Grain-level order facts: eine Zeile pro Order-Item.
      Basis für alle 6 KPIs der 4 Business Questions.
      Nur abgeschlossene (delivered) Bestellungen.
    model: ref('int_orders_complete')

    defaults:
      agg_time_dimension: order_purchase_timestamp

    entities:
      - name: order_item
        type: primary
        expr: order_item_id
      - name: order
        type: foreign
        expr: order_id

    dimensions:
      - name: order_purchase_timestamp
        type: time
        description: "Kaufdatum (Bestellzeitpunkt)"
        type_params:
          time_granularity: day

      - name: category
        type: categorical
        description: "Produktkategorie (englisch)"
        expr: category

      - name: customer_state
        type: categorical
        description: "Brasilianischer Bundesstaat des Kunden (ISO-Code)"
        expr: customer_state

      - name: review_score
        type: categorical
        description: "Kundenbewertung 1 (schlecht) bis 5 (sehr gut)"
        expr: review_score

    measures:
      # KPI-01 + KPI-02: Umsatz
      - name: total_revenue
        description: "Artikelpreis (ohne Versandkosten)"
        agg: sum
        expr: price
        agg_time_dimension: order_purchase_timestamp

      # Anzahl Bestellungen (für Verhältnismetriken)
      - name: order_count
        description: "Anzahl eindeutiger Bestellungen"
        agg: count_distinct
        expr: order_id
        agg_time_dimension: order_purchase_timestamp

      # KPI-03: Ø Lieferdauer
      - name: avg_delivery_days
        description: "Lieferdauer in Tagen (Kaufdatum → Lieferdatum)"
        agg: average
        expr: delivery_days
        agg_time_dimension: order_purchase_timestamp

      # KPI-04: Anteil verspäteter Lieferungen
      - name: late_orders
        description: "Anzahl verspäteter Lieferungen (is_late_flag = 1)"
        agg: sum
        expr: is_late_flag
        agg_time_dimension: order_purchase_timestamp

      # KPI-05 + KPI-06: Bewertungsscore
      - name: avg_review_score
        description: "Kundenbewertungsscore (1–5)"
        agg: average
        expr: review_score
        agg_time_dimension: order_purchase_timestamp

metrics:
  # KPI-01: Umsatz pro Kategorie (BQ-01)
  - name: revenue_by_category
    label: "Umsatz pro Kategorie"
    description: "KPI-01: Gesamtumsatz — nach Kategorie gruppieren: --group-by category"
    type: simple
    type_params:
      measure:
        name: total_revenue

  # KPI-02: Umsatz pro Region (BQ-02)
  - name: revenue_by_region
    label: "Umsatz pro Region"
    description: "KPI-02: Gesamtumsatz — nach Region gruppieren: --group-by customer_state"
    type: simple
    type_params:
      measure:
        name: total_revenue

  # KPI-03: Ø Lieferdauer (BQ-03)
  - name: avg_delivery_duration
    label: "Ø Lieferdauer (Tage)"
    description: "KPI-03: Durchschnittliche Lieferdauer — nach customer_state gruppierbar"
    type: simple
    type_params:
      measure:
        name: avg_delivery_days

  # Basis-Metriken für Ratio-Berechnung (KPI-04 + KPI-06)
  - name: total_late_orders
    label: "Anzahl verspäteter Lieferungen"
    description: "Basis-Metrik für Ratio: Anzahl verspäteter Lieferungen"
    type: simple
    type_params:
      measure:
        name: late_orders

  - name: total_order_count
    label: "Anzahl Bestellungen"
    description: "Basis-Metrik für Ratio: Eindeutige Bestellungen"
    type: simple
    type_params:
      measure:
        name: order_count

  # KPI-04: Anteil verspäteter Lieferungen (BQ-03)
  - name: late_delivery_rate
    label: "Anteil verspäteter Lieferungen"
    description: "KPI-04: Verspätete / Gesamtbestellungen — nach customer_state gruppierbar"
    type: ratio
    type_params:
      numerator:
        name: total_late_orders
      denominator:
        name: total_order_count

  # KPI-05: Ø Bewertungsscore (BQ-04)
  - name: avg_customer_review_score
    label: "Ø Kundenbewertungsscore"
    description: "KPI-05: Durchschnittlicher Bewertungsscore (1–5) — nach Region oder Zeitraum"
    type: simple
    type_params:
      measure:
        name: avg_review_score

  # KPI-06: Korrelation Verzögerung / Bewertung (BQ-04)
  # Abfrage: mf query --metrics avg_delivery_duration,avg_customer_review_score --group-by review_score
  - name: late_rate_by_score
    label: "Verspätungsrate nach Bewertungsscore"
    description: "KPI-06: Verspätungsrate je Score — zeigt Korrelation zwischen Verzögerung und Kundenzufriedenheit"
    type: ratio
    type_params:
      numerator:
        name: total_late_orders
      denominator:
        name: total_order_count
