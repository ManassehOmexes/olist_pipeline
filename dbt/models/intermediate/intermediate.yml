version: 2

models:
  - name: int_orders_enriched
    description: "Orders enriched with customer data (state, zip code)"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: customer_state
        tests:
          - not_null

  - name: int_delivery_times
    description: "Delivery time and delay status per order"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: delivery_days
        tests:
          - not_null
      - name: is_late
        tests:
          - not_null
