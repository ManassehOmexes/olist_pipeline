version: 2

models:
  - name: fct_sales
    description: "Revenue and order volume per product category (BQ-01)"
    columns:
      - name: category
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null

  - name: fct_regional_performance
    description: "Revenue and reviews per state (BQ-02)"
    columns:
      - name: state
        tests:
          - not_null
          - unique
      - name: total_revenue
        tests:
          - not_null

  - name: fct_delivery
    description: "Avg. delivery time and late delivery rate per state (BQ-03)"
    columns:
      - name: state
        tests:
          - not_null
          - unique
      - name: avg_delivery_days
        tests:
          - not_null
      - name: late_rate_pct
        tests:
          - not_null

  - name: fct_reviews
    description: "Review scores with delivery time correlation (BQ-04)"
    columns:
      - name: review_score
        tests:
          - not_null
          - unique

  - name: fct_company_performance
    description: >
      Company performance at order-item grain.
      Combines revenue, state, category and review score in one table.
      Serves all KPI cards and charts in Power BI simultaneously.
    columns:
      - name: order_item_pk
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
      - name: order_month
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
      - name: product_category
        tests:
          - not_null
      - name: item_revenue
        tests:
          - not_null
