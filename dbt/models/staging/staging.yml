version: 2

models:
  - name: stg_orders
    description: "Cleaned orders from Silver layer"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null

  - name: stg_customers
    description: "Customers with zip code and state"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_zip_code_prefix
        tests:
          - not_null

  - name: stg_order_items
    description: "Individual order line items with price and shipping cost"
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        tests:
          - not_null

  - name: stg_products
    description: "Products with category (incl. English translation)"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_sellers
    description: "Sellers with zip code and state"
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique

  - name: stg_order_reviews
    description: "Customer reviews per order"
    columns:
      - name: review_id
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null

  - name: stg_order_payments
    description: "Payment data per order"
    columns:
      - name: order_id
        tests:
          - not_null

  - name: stg_geolocation
    description: "Zip code → coordinates (aggregated to median)"
    columns:
      - name: zip_code_prefix
        tests:
          - not_null
          - unique
